<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Sign in</title>
  <link rel="stylesheet" href="/styles.css">
</head>

<body>
  <main class="login-screen">
    <form class="login-card" id="loginForm">
      <img class="brand-mark brand-logo login-brand" src="/logo.png" alt="Materials Inventory logo">
      <p class="eyebrow">MATERIALS MANAGEMENT</p>
      <h1>Sign in</h1>
      <p class="subheading">Sign in to access the inventory workspace.</p>
      <label class="field">Username<input id="loginUsername" autocomplete="username" required></label>
      <label class="field">Password<input id="loginPassword" type="password" autocomplete="current-password" required></label>
      <p class="form-error" id="loginError" role="alert"></p>
      <button class="primary-button" type="submit" id="loginButton">Sign in</button>
    </form>
  </main>
  <div class="toast" id="loginToast" role="status"></div>
  <script src="/login.js"></script>
</body>

</html>
